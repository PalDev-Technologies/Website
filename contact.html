    <script>
        document.getElementById("sendButton").addEventListener("click", async function () {
            const name = document.querySelector('input[name="name"]').value;
            const email = document.querySelector('input[name="email"]').value;
            const subject = document.querySelector('input[name="subject"]').value;
            const message = document.querySelector('textarea[name="message"]').value;

            if (!name || !email || !subject || !message) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Oops...',
                    text: 'Please fill out all fields!',
                });
                return;
            }

            try {
                const response = await fetch('https://enchanting-gaufre-11e46b.netlify.app/.netlify/functions/contact-function', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, subject, message }),
                });

                const result = await response.text();
                console.log('Response:', result);

                if (response.ok) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Message Sent!',
                        text: 'Your message has been sent successfully!',
                    });
                    document.getElementById("contactForm").reset();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: `Error sending email: ${result}`,
                    });
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: `Error sending email: ${error.message}`,
                });
            }
        });
    </script>

    <script>
        // Function to toggle between English and Arabic
        function toggleLanguage() {
            const currentLang = document.documentElement.getAttribute('lang');
            const newLang = currentLang === 'en' ? 'ar' : 'en';
            setLanguage(newLang);

            // Save the user's language preference in local storage
            localStorage.setItem('preferredLanguage', newLang);
        }

        // Function to set the language for the entire page
        function setLanguage(lang) {
            // Update HTML lang attribute and direction
            document.documentElement.setAttribute('lang', lang);
            document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            // Update all text content based on data attributes
            document.querySelectorAll('[data-en][data-ar]').forEach(element => {
                element.textContent = lang === 'ar' ? element.getAttribute('data-ar') : element.getAttribute('data-en');
            });

            // Update the button text
            const langToggle = document.getElementById('language-toggle');
            if (langToggle) {
                langToggle.textContent = lang === 'ar' ? 'English' : 'Arabic';
            }
        }

        // Load the user's language preference on page load
        document.addEventListener('DOMContentLoaded', () => {
            const preferredLanguage = localStorage.getItem('preferredLanguage') || 'en';
            setLanguage(preferredLanguage);
        });
    </script>
