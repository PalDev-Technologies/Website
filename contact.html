<script>
    // Function to toggle between English and Arabic
    function toggleLanguage() {
        const currentLang = document.documentElement.getAttribute('lang');
        const newLang = currentLang === 'en' ? 'ar' : 'en';
        setLanguage(newLang);

        // Save the user's language preference in local storage
        localStorage.setItem('preferredLanguage', newLang);
    }

    // Function to set the language for the entire page
    function setLanguage(lang) {
        // Update HTML lang attribute and direction
        document.documentElement.setAttribute('lang', lang);
        document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

        // Update all text content based on data attributes
        document.querySelectorAll('[data-en][data-ar]').forEach(element => {
            element.textContent = lang === 'ar' ? element.getAttribute('data-ar') : element.getAttribute('data-en');
        });

        // Update the button text
        const langToggle = document.getElementById('language-toggle');
        if (langToggle) {
            langToggle.textContent = lang === 'ar' ? 'English' : 'Arabic';
        }
    }

    // Load the user's language preference on page load
    document.addEventListener('DOMContentLoaded', () => {
        const preferredLanguage = localStorage.getItem('preferredLanguage') || 'en';
        setLanguage(preferredLanguage);
    });
</script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Get the language toggle button
            const languageToggleButton = document.getElementById('language-toggle');
    
            // Function to set language
            function setLanguage(lang) {
                // Set language in localStorage
                localStorage.setItem('selectedLanguage', lang);
    
                // Update the button text to indicate the current language
                languageToggleButton.innerText = lang === 'en' ? 'Arabic' : 'English';
    
                // Set the page direction to RTL for Arabic and LTR for English
                document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    
                // Select all elements with data-en and data-ar attributes
                const elements = document.querySelectorAll('[data-en][data-ar]');
    
                // Loop through each element and update its text content
                elements.forEach(element => {
                    element.textContent = lang === 'ar' ? element.getAttribute('data-ar') : element.getAttribute('data-en');
                });
            }
    
            // Function to toggle language
            function toggleLanguage() {
                // Get the current language from localStorage
                let currentLanguage = localStorage.getItem('selectedLanguage') || 'en';
                // Toggle the language variable between 'en' and 'ar'
                currentLanguage = currentLanguage === 'en' ? 'ar' : 'en';
                // Set the new language
                setLanguage(currentLanguage);
            }
    
            // Add an event listener to the button to call the toggleLanguage function when clicked
            languageToggleButton.addEventListener('click', toggleLanguage);
    
            // On page load, set the language to the one saved in localStorage, default to 'en'
            const savedLanguage = localStorage.getItem('selectedLanguage') || 'en';
            setLanguage(savedLanguage);
        });
    </script>
